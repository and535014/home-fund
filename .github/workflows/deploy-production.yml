name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Production version tag to deploy, for example v1.2.3"
        required: true
        type: string
      migration_status:
        description: "Completed gate for this tag (before dispatching deployment)"
        required: true
        type: choice
        options:
          - select-completed-gate
          - no-migration
          - backup-complete
      release_evidence:
        description: "GitHub evidence URL: migration decision, or verified backup/restore and external storage"
        required: true
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve tag version
        id: version
        env:
          WORKFLOW_REF: ${{ github.ref }}
          MIGRATION_STATUS: ${{ inputs.migration_status }}
          RELEASE_EVIDENCE: ${{ inputs.release_evidence }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          test "$WORKFLOW_REF" = refs/heads/main
          version="$INPUT_VERSION"
          case "$MIGRATION_STATUS" in
            no-migration|backup-complete) ;;
            *) echo "Complete and record the migration/backup gate before dispatch." >&2; exit 1 ;;
          esac
          if [[ ! "$RELEASE_EVIDENCE" =~ ^https://github\.com/[^[:space:]]+$ ]]; then
            echo "Provide a GitHub release evidence URL before authorizing deployment." >&2
            exit 1
          fi

          if [[ ! "$version" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid production version: $version" >&2
            echo "Use a tag in vX.X.X format, for example v1.2.3." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "## Manual deployment authorization"
            echo "- Version: $version"
            echo "- Migration decision: $MIGRATION_STATUS"
            echo "- Evidence: $RELEASE_EVIDENCE"
            echo "- Authorized by: $GITHUB_ACTOR"
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"

  preflight:
    name: Production Preflight
    outputs:
      source_commit: ${{ steps.source.outputs.source_commit }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - resolve-version

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/home_fund_ci
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-placeholder-secret
      CSV_IMPORT_PREVIEW_SECRET: ci-only-placeholder-secret
      MEMBER_BINDING_TOKEN_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      GOOGLE_CLIENT_ID: ci-google-client-id
      GOOGLE_CLIENT_SECRET: ci-google-client-secret

    steps:
      - name: Checkout version tag
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ needs.resolve-version.outputs.version }}
          fetch-depth: 0

      - name: Fetch main and tags
        run: git fetch origin main:refs/remotes/origin/main --tags --force

      - name: Verify release source
        id: source
        env:
          VERSION_TAG: ${{ needs.resolve-version.outputs.version }}
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Tag $VERSION_TAG is not contained in origin/main." >&2
            exit 1
          fi
          echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: corepack pnpm db:validate

      - name: Type check
        run: corepack pnpm type-check

      - name: Lint
        run: corepack pnpm lint

      - name: Unit tests
        run: corepack pnpm test

      - name: Build
        run: corepack pnpm build

      - name: Summarize verified release
        env:
          VERSION_TAG: ${{ needs.resolve-version.outputs.version }}
        run: |
          {
            echo "## Production preflight"
            echo
            echo "- Version: \`$VERSION_TAG\`"
            echo "- Commit: \`$(git rev-parse HEAD)\`"
            echo "- Preflight: passed"
            echo
            echo "The operator authorized deployment by manual dispatch after completing the migration decision and backup/restore gate. There is no environment reviewer wait."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs:
      - resolve-version
      - preflight
    environment: production

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      CSV_IMPORT_PREVIEW_SECRET: ${{ secrets.CSV_IMPORT_PREVIEW_SECRET }}
      MEMBER_BINDING_TOKEN_ENCRYPTION_KEY: ${{ secrets.MEMBER_BINDING_TOKEN_ENCRYPTION_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

    steps:
      - name: Checkout verified tag commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.source_commit }}
          fetch-depth: 0

      - name: Verify immutable tag before production operations
        env:
          SOURCE_COMMIT: ${{ needs.preflight.outputs.source_commit }}
          VERSION_TAG: ${{ needs.resolve-version.outputs.version }}
        run: |
          git fetch --no-tags origin "refs/tags/$VERSION_TAG:refs/deploy-verification/$VERSION_TAG"
          current_tag_commit="$(git rev-parse "refs/deploy-verification/${VERSION_TAG}^{commit}")"
          if [ "$current_tag_commit" != "$SOURCE_COMMIT" ] || [ "$(git rev-parse HEAD)" != "$SOURCE_COMMIT" ]; then
            echo "Tag moved after preflight; refusing production operations." >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Pull Vercel production environment
        run: corepack pnpm vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel production artifact
        run: corepack pnpm vercel build --prod --token="$VERCEL_TOKEN"

      - name: Apply production database migrations
        run: corepack pnpm db:deploy

      - name: Deploy Vercel production artifact
        id: deploy
        env:
          VERSION_TAG: ${{ needs.resolve-version.outputs.version }}
          SOURCE_COMMIT: ${{ needs.preflight.outputs.source_commit }}
        run: |
          deployment_url="$(corepack pnpm vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          {
            echo "## Production deployment"
            echo
            echo "- Version: $VERSION_TAG"
            echo "- Commit: $SOURCE_COMMIT"
            echo "- URL: $deployment_url"
            echo "- Vercel artifact build completed before migration"
            echo "- Database migration: \`corepack pnpm db:deploy\` completed before deploy"
            echo
            echo "### Smoke checklist"
            echo
            echo "- Open \`/login\`."
            echo "- Start Google sign-in from the production origin."
            echo "- Confirm an admin member reaches the dashboard."
            echo "- Confirm non-admin access to admin routes is denied."
            echo "- Confirm logout returns to login."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke production deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          smoke_base_url="${BETTER_AUTH_URL:-$DEPLOYMENT_URL}"
          smoke_base_url="${smoke_base_url%/}"

          curl --fail --location --max-time 30 "$smoke_base_url/login" >/dev/null
          curl --fail --location --max-time 30 "$smoke_base_url/favicon.ico" >/dev/null

          cron_body="$(mktemp)"
          cron_status="$(
            curl \
              --silent \
              --show-error \
              --location \
              --max-time 30 \
              --output "$cron_body" \
              --write-out "%{http_code}" \
              --header "Authorization: Bearer invalid-token" \
              "$smoke_base_url/api/cron/recurring-posting"
          )"

          if [ "$cron_status" != "401" ]; then
            echo "Expected cron invalid-token smoke to return HTTP 401, received $cron_status." >&2
            cat "$cron_body" >&2
            exit 1
          fi
