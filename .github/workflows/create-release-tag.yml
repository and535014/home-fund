name: Create Release Tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New immutable release tag, for example v1.2.3"
        required: true
        type: string

concurrency:
  group: create-release-tag
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  create-release-tag:
    name: Create release tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/home_fund_ci
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-placeholder-secret
      CSV_IMPORT_PREVIEW_SECRET: ci-only-placeholder-secret
      MEMBER_BINDING_TOKEN_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      GOOGLE_CLIENT_ID: ci-google-client-id
      GOOGLE_CLIENT_SECRET: ci-google-client-secret

    steps:
      - name: Require manual main dispatch
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: test "$WORKFLOW_REF" = refs/heads/main

      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Validate candidate tag
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          git fetch origin main:refs/remotes/origin/main --tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          node scripts/validate-release-tag.mjs

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: corepack pnpm db:validate

      - name: Type check
        run: corepack pnpm type-check

      - name: Lint
        run: corepack pnpm lint

      - name: Unit tests
        run: corepack pnpm test

      - name: Build
        run: corepack pnpm build

      - name: Recheck latest main and version after preflight
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          git fetch origin main:refs/remotes/origin/main --tags
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main advanced during preflight; rerun before consuming a release version." >&2
            exit 1
          fi
          node scripts/validate-release-tag.mjs

      - name: Create and push tag
        env:
          TAG_NAME: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
          git push origin "refs/tags/$TAG_NAME:refs/tags/$TAG_NAME"

      - name: Summarize release tag
        env:
          TAG_NAME: ${{ steps.version.outputs.tag }}
        run: |
          {
            echo "## Release tag created"
            echo
            echo "- Tag: \`$TAG_NAME\`"
            echo "- Source: \`main\`"
            echo "- Commit: \`$(git rev-parse HEAD)\`"
            echo
            echo "Complete the migration decision and backup/restore gate, then manually dispatch Deploy Production with this tag. Tag push does not trigger deployment."
          } >> "$GITHUB_STEP_SUMMARY"
