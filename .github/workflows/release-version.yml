name: Prepare Release Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag, for example v1.2.3"
        required: true
        type: string

concurrency:
  group: release-version
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-release:
    name: Prepare release PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_BOT_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}

    steps:
      - name: Validate release bot token
        run: |
          if [ -z "$RELEASE_BOT_TOKEN" ]; then
            echo "Missing RELEASE_BOT_TOKEN repository secret." >&2
            echo "Use a fine-grained token or GitHub App token with contents and pull request write access." >&2
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_BOT_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve next version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const inputVersion = process.env.INPUT_VERSION;
          const inputMatch = /^v(\d+)\.(\d+)\.(\d+)$/.exec(inputVersion ?? "");

          if (!inputMatch) {
            console.error(`Release version must use vX.Y.Z format, received: ${inputVersion}`);
            process.exit(1);
          }

          const packageJson = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const previous = packageJson.version;
          const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(previous);

          if (!match) {
            console.error(`package.json version must be strict SemVer X.Y.Z, received: ${previous}`);
            process.exit(1);
          }

          const previousParts = match.slice(1).map((part) => Number(part));
          const nextParts = inputMatch.slice(1).map((part) => Number(part));
          const compare = (left, right) => {
            for (let index = 0; index < 3; index += 1) {
              if (left[index] !== right[index]) {
                return left[index] - right[index];
              }
            }

            return 0;
          };

          if (compare(nextParts, previousParts) <= 0) {
            console.error(`Release version ${inputVersion} must be greater than package.json version ${previous}.`);
            process.exit(1);
          }

          const next = nextParts.join(".");
          const tag = inputVersion;
          const branch = `release/${tag}`;
          const output = process.env.GITHUB_OUTPUT;

          fs.appendFileSync(output, `previous=${previous}\n`);
          fs.appendFileSync(output, `next=${next}\n`);
          fs.appendFileSync(output, `tag=${tag}\n`);
          fs.appendFileSync(output, `branch=${branch}\n`);
          NODE

      - name: Check release branch and tag
        env:
          BRANCH_NAME: ${{ steps.version.outputs.branch }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH_NAME" >/dev/null 2>&1; then
            echo "Release branch already exists: $BRANCH_NAME" >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            echo "Release tag already exists: $TAG_NAME" >&2
            exit 1
          fi

      - name: Update package version
        env:
          NEXT_VERSION: ${{ steps.version.outputs.next }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const next = process.env.NEXT_VERSION;
          const packageJson = JSON.parse(fs.readFileSync("package.json", "utf8"));
          packageJson.version = next;
          fs.writeFileSync("package.json", `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE

          changed_files="$(git diff --name-only)"

          if [ "$changed_files" != "package.json" ]; then
            echo "Unexpected files changed while preparing release:" >&2
            printf '%s\n' "$changed_files" >&2
            exit 1
          fi

          if git diff --quiet -- package.json; then
            echo "package.json version did not change." >&2
            exit 1
          fi

      - name: Commit release version
        env:
          BRANCH_NAME: ${{ steps.version.outputs.branch }}
          NEXT_VERSION: ${{ steps.version.outputs.next }}
        run: |
          git config user.name "home-fund-release-bot"
          git config user.email "home-fund-release-bot@users.noreply.github.com"
          git switch -c "$BRANCH_NAME"
          git add package.json
          git commit -m "Bump version to $NEXT_VERSION"
          git push --set-upstream origin "$BRANCH_NAME"

      - name: Open release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
          BRANCH_NAME: ${{ steps.version.outputs.branch }}
          PREVIOUS_VERSION: ${{ steps.version.outputs.previous }}
          NEXT_VERSION: ${{ steps.version.outputs.next }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
        run: |
          body_file="$(mktemp)"
          cat > "$body_file" <<BODY
          ## Release

          - Previous version: \`$PREVIOUS_VERSION\`
          - Next version: \`$NEXT_VERSION\`
          - Expected tag: \`$TAG_NAME\`

          Merging this PR does not deploy production. After merge, run the \`Create Release Tag\` workflow to create \`$TAG_NAME\`.
          BODY

          gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "Release $TAG_NAME" \
            --body-file "$body_file"
